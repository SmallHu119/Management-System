server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: hazmat-safety-system
  
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/hazmat_safety?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root
  
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.hazmat.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT配置
jwt:
  secret: HazmatSafetySystemSecretKey2024VeryLongSecretKeyForJWTTokenGeneration
  expiration: 86400000  # 24小时

# 文件上传配置
file:
  upload-path: ./uploads/

# 日志配置
logging:
  level:
    com.hazmat: debug
    org.springframework.security: debug

# DeepSeek AI 配置
deepseek:
  api-key: sk-5ec0f00f371a443a9f28072340234b48
  api-url: https://api.deepseek.com/v1/chat/completions
  model: deepseek-chat
